---
# Fry role — runs at instance launch time via EC2 userdata / cloud-init.
# Renders environment-specific nginx config from variables set in userdata.
# Variables (server_name, environment) are injected by Terraform's templatefile().

- name: Render nginx app config from fry variables
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/app.conf
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c /etc/nginx/nginx.conf
  notify: Reload nginx

handlers:
  - name: Reload nginx
    ansible.builtin.systemd:
      name: nginx
      state: reloaded
