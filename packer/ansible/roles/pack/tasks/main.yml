---
# Pack role — runs at AMI build time.
# Installs nginx, deploys the static page, and enables the service.
# After this, the AMI is sealed. No environment-specific config here.

- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Deploy static HTML page
  ansible.builtin.copy:
    src: index.html
    dest: /usr/share/nginx/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Remove default nginx server block (will be replaced by fry phase)
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Create placeholder nginx app config (overwritten by fry userdata)
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/app.conf
    content: |
      server {
          listen       80 default_server;
          server_name  _;
          root         /usr/share/nginx/html;
          index        index.html;
          location / {
              try_files $uri $uri/ =404;
          }
          location /health {
              return 200 "healthy\n";
              add_header Content-Type text/plain;
          }
      }
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

handlers:
  - name: Reload nginx
    ansible.builtin.systemd:
      name: nginx
      state: reloaded
