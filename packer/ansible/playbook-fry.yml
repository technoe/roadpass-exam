---
# Fry playbook — intended to run at instance launch time via cloud-init/userdata.
# Applies environment-specific variables to the pre-packed AMI.
#
# To run manually on a launched instance:
#   ansible-playbook -i localhost, -c local playbook-fry.yml \
#     -e "server_name=staging.example.com environment=staging"

- name: Fry nginx instance
  hosts: all
  become: true
  gather_facts: true

  vars:
    # These defaults are overridden by userdata environment variables
    # which are written to /etc/nginx-fry-vars.env by the Terraform userdata script.
    server_name: "localhost"
    environment: "staging"

  pre_tasks:
    - name: Load fry variables from userdata-written env file
      ansible.builtin.slurp:
        src: /etc/nginx-fry-vars.env
      register: fry_vars_raw
      ignore_errors: true

    - name: Parse fry variables
      ansible.builtin.set_fact:
        server_name: "{{ (fry_vars_raw.content | b64decode | regex_search('SERVER_NAME=(.+)', '\\1') | first) | default(server_name) }}"
        environment: "{{ (fry_vars_raw.content | b64decode | regex_search('ENVIRONMENT=(.+)', '\\1') | first) | default(environment) }}"
      when: fry_vars_raw is not failed

  roles:
    - fry
